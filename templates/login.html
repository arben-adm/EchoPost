<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09090b">
<title>EchoPost</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090b;--surface:#111113;--surface2:#18181b;
  --border:#27272a;
  --text:#fafafa;--dim:#71717a;--dimmer:#3f3f46;
  --accent:#3b82f6;
  --red:#ef4444;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;display:flex;align-items:center;justify-content:center}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px;width:min(380px,90vw)}
.logo{font-size:24px;font-weight:600;letter-spacing:-.03em;color:var(--text);text-align:center;margin-bottom:32px}
.logo span{color:var(--accent)}
.error{color:var(--red);font-size:12px;text-align:center;margin-bottom:12px}
.fi{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--sans);font-size:13px;padding:10px 14px;outline:none;transition:border-color .15s ease;margin-bottom:16px}
.fi:focus{border-color:var(--accent)}
.fi::placeholder{color:var(--dimmer)}
.btn-primary{display:block;width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;transition:opacity .15s ease}
.btn-primary:hover{opacity:.88}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Echo<span>Post</span></div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form action="/auth" method="POST">
    <input class="fi" type="password" name="password" autofocus placeholder="Passwort">
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn-primary">Anmelden</button>
  </form>
</div>
</body>
</html>
